<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simplifica MEI — Área do cliente (protótipo)</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--green:#14a064;--bg:#f2f8f5;--sf:#fff;--tx:#001028;--mu:#4a6878;--bd:#b8ddd0;--pale:#e6f4ef;--pri:#001450;--ptx:#fff;--wb:#fef3e2;--wt:#8a4b08;--side:#001450;--mine:#001450;--mtx:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1620;--sf:#11222e;--tx:#e8f2ee;--mu:#9db4bf;--bd:#24404a;--pale:#14302b;--pri:#0e8050;--wb:#33260f;--wt:#f0b469;--side:#06101f;--mine:#0e8050}}
:root[data-theme="dark"]{--bg:#0a1620;--sf:#11222e;--tx:#e8f2ee;--mu:#9db4bf;--bd:#24404a;--pale:#14302b;--pri:#0e8050;--wb:#33260f;--wt:#f0b469;--side:#06101f;--mine:#0e8050}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{font-family:'Nunito Sans',sans-serif;background:var(--bg);color:var(--tx);line-height:1.55;font-size:15px}
h1,h2,h3,.brand,button,.badge{font-family:'Nunito',sans-serif}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--green);outline-offset:2px}
#app{height:100%}
.shell{display:flex;height:100%}
aside{width:224px;background:var(--side);color:#fff;display:flex;flex-direction:column;padding:20px 12px;gap:4px;flex-shrink:0}
.brand{display:flex;align-items:center;gap:9px;font-weight:900;font-size:17px;padding:4px 10px 22px}
.mark{width:28px;height:28px;border-radius:8px;background:var(--green);display:grid;place-items:center}
aside button.nv{background:none;border:0;color:#c9d6ee;text-align:left;padding:10px 12px;border-radius:10px;cursor:pointer;font-weight:700;font-size:14px}
aside button.nv:hover{background:rgba(255,255,255,.08)}
aside button.nv[aria-current="page"]{background:var(--green);color:#fff}
.who{margin-top:auto;padding:12px;font-size:13px;color:#c9d6ee;border-top:1px solid rgba(255,255,255,.14)}
.who b{display:block;color:#fff}
.who button{background:none;border:0;color:#6ecba0;cursor:pointer;font-weight:700;margin-top:6px;padding:0}
.main{flex:1;min-width:0;min-height:0;overflow:auto;padding:28px clamp(16px,4vw,44px) 40px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
h2{font-weight:900;font-size:26px}
.badge{background:var(--pale);color:var(--tx);border:1px solid var(--bd);border-radius:20px;padding:4px 14px;font-weight:700;font-size:13px}
.proto{background:var(--wb);color:var(--wt);border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:20px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:16px}
.hero h1{font-weight:900;font-size:clamp(26px,4vw,38px);line-height:1.15;max-width:560px}
.pips{display:flex;gap:8px;margin:18px 0 10px;flex-wrap:wrap}
.pips i{width:44px;height:14px;border-radius:7px;background:var(--pale);border:1px solid var(--bd)}
.pips i.on{background:var(--green);border-color:var(--green)}
.pips i.x{background:#d9822b;border-color:#d9822b}
.mu{color:var(--mu)}
h3{font-weight:800;font-size:16px;margin-bottom:6px}
.big{font-family:'Nunito';font-weight:900;font-size:26px}
.btn{background:var(--pri);color:var(--ptx);border:0;border-radius:28px;padding:10px 22px;font-weight:700;cursor:pointer}
.btn:hover{filter:brightness(1.12)}
.btn.ol{background:none;color:var(--tx);border:1.5px solid var(--bd)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.sm{padding:6px 14px;font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;flex:1;min-width:150px}
input,select{background:var(--sf);border:1.5px solid var(--bd);border-radius:10px;padding:9px 12px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:13px;color:var(--mu);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--bd)}
td{padding:11px 10px;border-bottom:1px solid var(--bd);vertical-align:middle}
tr:last-child td{border-bottom:0}
.st{border-radius:14px;padding:2px 12px;font-size:12px;font-weight:700;background:var(--pale)}
.st.a{background:var(--wb);color:var(--wt)}
.chat{display:flex;flex-direction:column;height:min(520px,62vh)}
.msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:4px 2px 12px}
.m{max-width:78%;padding:9px 14px;border-radius:16px;background:var(--pale);border-bottom-left-radius:4px}
.m.me{align-self:flex-end;background:var(--mine);color:var(--mtx);border-radius:16px;border-bottom-right-radius:4px}
.m small{display:block;opacity:.7;font-size:11px}
.lock{opacity:.75}
.login{display:grid;grid-template-columns:1fr 1fr;height:100%}
.lp{background:var(--side);color:#fff;padding:clamp(24px,6vw,64px);display:flex;flex-direction:column;justify-content:center;gap:16px}
.lp h1{font-weight:900;font-size:clamp(30px,4vw,46px);line-height:1.12}
.lp p{color:#c9d6ee;max-width:380px}
.rp{display:grid;place-items:center;padding:24px}
.rp .card{width:min(380px,100%);display:flex;flex-direction:column;gap:14px}
@media(max-width:720px){
.shell{flex-direction:column-reverse}
aside{width:auto;flex-direction:row;overflow-x:auto;padding:8px;gap:2px}
.brand,.who{display:none}
aside button.nv{white-space:nowrap}
.login{grid-template-columns:1fr;height:auto}
.m{max-width:90%}
}
@media(prefers-reduced-motion:no-preference){.pips i.on{animation:p .5s ease both}.pips i.on:nth-child(2){animation-delay:.08s}.pips i.on:nth-child(3){animation-delay:.16s}.pips i.on:nth-child(4){animation-delay:.24s}@keyframes p{from{transform:scaleX(.2);opacity:0}}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=n=>Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const LIM={Essencial:5,Premium:15};
const S={role:null,view:'inicio',msg:'',
clients:[{n:'Maria Souza',b:'Doces da Maria',plan:'Essencial',used:null},{n:'Carlos Lima',b:'CL Fretes',plan:'Premium',used:8},{n:'Ana Prado',b:'Ana Studio Foto',plan:'Essencial',used:5}],
services:[{d:'Entrega de 40 caixas de brigadeiro',v:480,t:'28/10/2026'},{d:'Bolo de aniversário (encomenda)',v:220,t:'30/10/2026'},{d:'Kit festa 30 pessoas',v:390,t:'02/11/2026'}],
notas:[{n:1,tom:'Padaria Central',d:'Entrega de doces',v:480,ex:false},{n:2,tom:'Joana Reis',d:'Bolo de aniversário',v:220,ex:false},{n:3,tom:'Buffet Alegria',d:'Kit festa',v:390,ex:false}],
boletos:[{id:1,d:'Mensalidade Simplifica MEI — novembro',v:149,venc:'10/11/2026',pago:false,l:'23793.38128 60000.000003 00000.000408 1 98760000014900'},{id:2,d:'DAS MEI — novembro',v:86.05,venc:'20/11/2026',pago:false,l:'85850000000 0 86050001128 3 11202600000 6 00000000000 1'},{id:3,d:'DAS MEI — outubro',v:86.05,venc:'20/10/2026',pago:true,l:''}],
msgs:[{f:'p',t:'Oi, Maria! O DAS de novembro já está disponível na aba Boletos.',h:'09:12'},{f:'c',t:'Perfeito, obrigada! Preciso emitir uma nota hoje ainda.',h:'09:20'}]};
const me=()=>S.clients[0];
const used=()=>S.notas.length;
const lim=()=>LIM[me().plan];
const hora=()=>new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});

function login(){return `<div class="login"><div class="lp"><div class="brand" style="padding:0"><span class="mark"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8l3.5 3.5L13 5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Simplifica MEI</div><h1>Tudo do seu MEI, num só lugar.</h1><p>Notas, boletos, serviços e conversa com a gente, sem depender de planilha.</p></div>
<div class="rp"><div class="card"><h2 style="font-size:22px">Entrar</h2><label>E-mail<input id="em" value="maria@docesdamaria.com.br" autocomplete="off"></label><label>Senha<input id="pw" type="password" value="123456"></label><button class="btn" data-a="in-c">Entrar como cliente</button><button class="btn ol" data-a="in-p">Entrar como prestador</button><p class="mu" style="font-size:12px">Protótipo: nenhum login real. Os dois botões mostram o que cada perfil enxerga.</p></div></div></div>`}

function vInicio(){const u=used(),l=lim(),p=me().plan,n=Math.max(u,l);
const pips=Array.from({length:n},(_,i)=>`<i class="${i<u?(i>=l?'x':'on'):''}"></i>`).join('');
const b=S.boletos.find(x=>!x.pago),tot=S.services.reduce((a,s)=>a+s.v,0),pr=p==='Premium';
return `<div class="card hero"><h1>${u} de ${l} notas usadas em novembro</h1><div class="pips" aria-hidden="true">${pips}</div><p class="mu">${u<l?`Ainda dá para emitir ${l-u}.`:'Limite do plano atingido. Cada nota extra custa R$ 20.'}</p><div style="margin-top:14px"><button class="btn" data-a="go-notas">Emitir nota</button></div></div>
<div class="grid"><div class="card"><h3>Próximo boleto</h3>${b?`<div class="big">${brl(b.v)}</div><p class="mu">${esc(b.d)}<br>vence em ${b.venc}</p><button class="btn ol sm" style="margin-top:10px" data-a="go-boletos">Ver boletos</button>`:'<p class="mu">Nenhum boleto em aberto.</p>'}</div>
<div class="card"><h3>Serviços registrados</h3><div class="big">${brl(tot)}</div><p class="mu">${S.services.length} serviços neste mês</p><button class="btn ol sm" style="margin-top:10px" data-a="go-servicos">Registrar serviço</button></div>
<div class="card ${pr?'':'lock'}"><h3>Contratação de funcionário</h3><p class="mu">${pr?'Admissão, registro e folha mensal pela nossa equipe.':'Disponível no plano Premium. Fale com a equipe para mudar de plano.'}</p><button class="btn ol sm" style="margin-top:10px" data-a="${pr?'go-chat':'go-chat'}" ${pr?'':'aria-disabled="true"'}>${pr?'Solicitar admissão':'Pedir upgrade'}</button></div></div>`}

function vServ(){const rows=S.services.map(s=>`<tr><td>${esc(s.d)}</td><td>${s.t}</td><td>${brl(s.v)}</td></tr>`).join('');
return `<div class="card"><div class="row"><label style="flex:2">Descrição do serviço<input id="sd" placeholder="Ex.: Entrega de 20 marmitas"></label><label>Valor (R$)<input id="sv" inputmode="decimal" placeholder="0,00"></label><button class="btn" data-a="add-serv">Registrar serviço</button></div><p class="mu" id="msg">${esc(S.msg)}</p></div>
<div class="card tw" style="margin-top:16px"><table><thead><tr><th>Serviço</th><th>Data</th><th>Valor</th></tr></thead><tbody>${rows}</tbody></table></div>`}

function vNotas(){const u=used(),l=lim(),ex=u>=l;
const rows=[...S.notas].reverse().map(n=>`<tr><td>nº ${n.n}</td><td>${esc(n.tom)}</td><td>${esc(n.d)}</td><td>${brl(n.v)}</td><td><span class="st ${n.ex?'a':''}">${n.ex?'Excedente R$ 20':'Emitida'}</span></td></tr>`).join('');
return `<div class="proto">Protótipo: nenhuma nota com validade fiscal é emitida. Na versão real, esta tela chama uma API de emissão.</div>
<div class="card">${ex?`<p class="proto" style="margin-bottom:12px">Você usou as ${l} notas do plano ${me().plan}. A próxima será cobrada à parte (R$ 20).</p>`:''}<div class="row"><label>Tomador<input id="nt" placeholder="Nome ou CNPJ do cliente"></label><label style="flex:2">Serviço prestado<input id="nd" placeholder="Descrição na nota"></label><label>Valor (R$)<input id="nv" inputmode="decimal" placeholder="0,00"></label><button class="btn" data-a="add-nota">${ex?'Emitir nota (R$ 20)':'Emitir nota'}</button></div><p class="mu">${esc(S.msg)}</p></div>
<div class="card tw" style="margin-top:16px"><table><thead><tr><th>Nota</th><th>Tomador</th><th>Serviço</th><th>Valor</th><th>Situação</th></tr></thead><tbody>${rows}</tbody></table></div>`}

function vBol(){const rows=S.boletos.map(b=>`<tr><td>${esc(b.d)}</td><td>${b.venc}</td><td>${brl(b.v)}</td><td><span class="st ${b.pago?'':'a'}">${b.pago?'Pago':'Em aberto'}</span></td><td>${b.pago?'':`<button class="btn ol sm" data-a="copy" data-i="${b.id}">Copiar código</button> <button class="btn sm" data-a="pay" data-i="${b.id}">Marcar como pago</button>`}</td></tr>`).join('');
return `<div class="proto">Dados de exemplo. Na versão real, a mensalidade vem de um gateway de pagamento e o DAS da integração com a Receita.</div><div class="card tw"><table><thead><tr><th>Cobrança</th><th>Vencimento</th><th>Valor</th><th>Situação</th><th></th></tr></thead><tbody>${rows}</tbody></table></div><p class="mu" style="margin-top:10px">${esc(S.msg)}</p>`}

function vChat(){const c=S.role==='c',list=S.msgs.map(m=>`<div class="m ${m.f===S.role?'me':''}">${esc(m.t)}<small>${m.f==='p'?'Equipe':'Maria'} · ${m.h}</small></div>`).join('');
return `<div class="card chat"><h3>${c?'Equipe Simplifica MEI':'Maria Souza — Doces da Maria'}</h3><div class="msgs" id="ms">${list}</div><div class="row" style="margin:0"><label style="min-width:0"><input id="ci" placeholder="Escreva uma mensagem" autocomplete="off"></label><button class="btn" data-a="send">Enviar</button></div></div>`}

function vCli(){const rows=S.clients.map((c,i)=>{const u=i===0?used():c.used,l=LIM[c.plan];return `<tr><td><b>${esc(c.n)}</b><br><span class="mu">${esc(c.b)}</span></td><td><select data-plan="${i}" aria-label="Plano de ${esc(c.n)}">${Object.keys(LIM).map(p=>`<option ${p===c.plan?'selected':''}>${p}</option>`).join('')}</select></td><td>${u} de ${l}</td><td><span class="st ${u>=l?'a':''}">${u>=l?'No limite':'Dentro do plano'}</span></td></tr>`}).join('');
return `<div class="proto">Trocar o plano muda as permissões do cliente na hora. Teste: mude a Maria para Premium e entre como cliente.</div><div class="card tw"><table><thead><tr><th>Cliente</th><th>Plano</th><th>Notas no mês</th><th>Situação</th></tr></thead><tbody>${rows}</tbody></table></div>`}

const TITLES={inicio:'Início',servicos:'Serviços',notas:'Notas fiscais',boletos:'Boletos',chat:'Chat',clientes:'Clientes'};
function render(){const a=$('#app');
if(!S.role){a.innerHTML=login();return}
const c=S.role==='c',nav=c?['inicio','servicos','notas','boletos','chat']:['clientes','chat'];
const V={inicio:vInicio,servicos:vServ,notas:vNotas,boletos:vBol,chat:vChat,clientes:vCli}[S.view]();
a.innerHTML=`<div class="shell"><aside><div class="brand"><span class="mark"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8l3.5 3.5L13 5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Simplifica MEI</div>${nav.map(k=>`<button class="nv" data-a="go-${k}" ${k===S.view?'aria-current="page"':''}>${TITLES[k]}</button>`).join('')}<div class="who"><b>${c?'Maria Souza':'Equipe Simplifica'}</b>${c?'Doces da Maria':'Prestador'}<br><button data-a="out">Sair</button></div></aside>
<main class="main"><div class="top"><h2>${TITLES[S.view]}</h2>${c?`<span class="badge">Plano ${me().plan} · ${lim()} notas por mês</span>`:'<span class="badge">Visão do prestador</span>'}</div>${V}</main></div>`;
const m=$('#ms');if(m)m.scrollTop=m.scrollHeight}

const num=v=>parseFloat(String(v).replace(/\./g,'').replace(',','.'));
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
if(a==='in-c'||a==='in-p'){S.role=a==='in-c'?'c':'p';S.view=S.role==='c'?'inicio':'clientes'}
else if(a==='out'){S.role=null}
else if(a.startsWith('go-')){S.view=a.slice(3);S.msg=''}
else if(a==='add-serv'){const d=$('#sd').value.trim(),v=num($('#sv').value);
if(!d||!(v>0)){S.msg='Preencha a descrição e um valor maior que zero.'}
else{S.services.unshift({d,v,t:new Date().toLocaleDateString('pt-BR')});S.msg='Serviço registrado.'}}
else if(a==='add-nota'){const t=$('#nt').value.trim(),d=$('#nd').value.trim(),v=num($('#nv').value);
if(!t||!d||!(v>0)){S.msg='Preencha tomador, serviço e um valor maior que zero.'}
else{const ex=used()>=lim();S.notas.push({n:used()+1,tom:t,d,v,ex});S.msg=`Nota nº ${used()} emitida${ex?' (excedente)':''}.`}}
else if(a==='pay'){S.boletos.find(x=>x.id==b.dataset.i).pago=true;S.msg='Pagamento registrado.'}
else if(a==='copy'){const l=S.boletos.find(x=>x.id==b.dataset.i).l;try{navigator.clipboard.writeText(l)}catch(_){}S.msg='Código copiado: '+l}
else if(a==='send'){const i=$('#ci'),t=i.value.trim();if(!t)return;S.msgs.push({f:S.role,t,h:hora()});
if(S.role==='c')setTimeout(()=>{S.msgs.push({f:'p',t:'Recebi! Já estou vendo e te respondo em instantes.',h:hora()});if(S.view==='chat'&&S.role==='c'){render();const x=$('#ci');x&&x.focus()}},1300)}
render();if(a==='send'){const x=$('#ci');x&&x.focus()}});
document.addEventListener('change',e=>{const s=e.target.closest('[data-plan]');if(!s)return;S.clients[+s.dataset.plan].plan=s.value;render()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='ci')document.querySelector('[data-a="send"]').click()});
render();
</script>
</body>
</html>
