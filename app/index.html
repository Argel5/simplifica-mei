<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simplifica MEI — Área do cliente</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--green:#14a064;--bg:#f2f8f5;--sf:#fff;--tx:#001028;--mu:#4a6878;--bd:#b8ddd0;--pale:#e6f4ef;--pri:#001450;--ptx:#fff;--wb:#fef3e2;--wt:#8a4b08;--side:#001450;--mine:#001450;--mtx:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1620;--sf:#11222e;--tx:#e8f2ee;--mu:#9db4bf;--bd:#24404a;--pale:#14302b;--pri:#0e8050;--wb:#33260f;--wt:#f0b469;--side:#06101f;--mine:#0e8050}}
:root[data-theme="dark"]{--bg:#0a1620;--sf:#11222e;--tx:#e8f2ee;--mu:#9db4bf;--bd:#24404a;--pale:#14302b;--pri:#0e8050;--wb:#33260f;--wt:#f0b469;--side:#06101f;--mine:#0e8050}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{font-family:'Nunito Sans',sans-serif;background:var(--bg);color:var(--tx);line-height:1.55;font-size:15px}
h1,h2,h3,.brand,button,.badge{font-family:'Nunito',sans-serif}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--green);outline-offset:2px}
#app{height:100%}
.shell{display:flex;height:100%}
aside{width:224px;background:var(--side);color:#fff;display:flex;flex-direction:column;padding:20px 12px;gap:4px;flex-shrink:0}
.brand{display:flex;align-items:center;gap:9px;font-weight:900;font-size:17px;padding:4px 10px 22px}
.mark{width:28px;height:28px;border-radius:8px;background:var(--green);display:grid;place-items:center}
aside button.nv{background:none;border:0;color:#c9d6ee;text-align:left;padding:10px 12px;border-radius:10px;cursor:pointer;font-weight:700;font-size:14px}
aside button.nv:hover{background:rgba(255,255,255,.08)}
aside button.nv[aria-current="page"]{background:var(--green);color:#fff}
.who{margin-top:auto;padding:12px;font-size:13px;color:#c9d6ee;border-top:1px solid rgba(255,255,255,.14)}
.who b{display:block;color:#fff}
.who button{background:none;border:0;color:#6ecba0;cursor:pointer;font-weight:700;margin-top:6px;padding:0}
.main{flex:1;min-width:0;min-height:0;overflow:auto;padding:28px clamp(16px,4vw,44px) 40px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
h2{font-weight:900;font-size:26px}
.badge{background:var(--pale);color:var(--tx);border:1px solid var(--bd);border-radius:20px;padding:4px 14px;font-weight:700;font-size:13px}
.proto{background:var(--wb);color:var(--wt);border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:20px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:16px}
.hero h1{font-weight:900;font-size:clamp(26px,4vw,38px);line-height:1.15;max-width:560px}
.pips{display:flex;gap:8px;margin:18px 0 10px;flex-wrap:wrap}
.pips i{width:44px;height:14px;border-radius:7px;background:var(--pale);border:1px solid var(--bd)}
.pips i.on{background:var(--green);border-color:var(--green)}
.pips i.x{background:#d9822b;border-color:#d9822b}
.mu{color:var(--mu)}
h3{font-weight:800;font-size:16px;margin-bottom:6px}
.big{font-family:'Nunito';font-weight:900;font-size:26px}
.btn{background:var(--pri);color:var(--ptx);border:0;border-radius:28px;padding:10px 22px;font-weight:700;cursor:pointer}
.btn:hover{filter:brightness(1.12)}
.btn.ol{background:none;color:var(--tx);border:1.5px solid var(--bd)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.sm{padding:6px 14px;font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;flex:1;min-width:150px}
input,select{background:var(--sf);border:1.5px solid var(--bd);border-radius:10px;padding:9px 12px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:13px;color:var(--mu);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--bd)}
td{padding:11px 10px;border-bottom:1px solid var(--bd);vertical-align:middle}
tr:last-child td{border-bottom:0}
.st{border-radius:14px;padding:2px 12px;font-size:12px;font-weight:700;background:var(--pale)}
.st.a{background:var(--wb);color:var(--wt)}
.chat{display:flex;flex-direction:column;height:min(520px,62vh)}
.msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:4px 2px 12px}
.m{max-width:78%;padding:9px 14px;border-radius:16px;background:var(--pale);border-bottom-left-radius:4px}
.m.me{align-self:flex-end;background:var(--mine);color:var(--mtx);border-radius:16px;border-bottom-right-radius:4px}
.m small{display:block;opacity:.7;font-size:11px}
.lock{opacity:.75}
.login{display:grid;grid-template-columns:1fr 1fr;height:100%}
.lp{background:var(--side);color:#fff;padding:clamp(24px,6vw,64px);display:flex;flex-direction:column;justify-content:center;gap:16px}
.lp h1{font-weight:900;font-size:clamp(30px,4vw,46px);line-height:1.12}
.lp p{color:#c9d6ee;max-width:380px}
.rp{display:grid;place-items:center;padding:24px}
.rp .card{width:min(380px,100%);display:flex;flex-direction:column;gap:14px}
@media(max-width:720px){
.shell{flex-direction:column-reverse}
aside{width:auto;flex-direction:row;overflow-x:auto;padding:8px;gap:2px}
.brand,.who{display:none}
aside button.nv{white-space:nowrap}
.login{grid-template-columns:1fr;height:auto}
.m{max-width:90%}
}
@media(prefers-reduced-motion:no-preference){.pips i.on{animation:p .5s ease both}.pips i.on:nth-child(2){animation-delay:.08s}.pips i.on:nth-child(3){animation-delay:.16s}.pips i.on:nth-child(4){animation-delay:.24s}@keyframes p{from{transform:scaleX(.2);opacity:0}}}
</style>
</head>
<body>
<div id="app"></div>
<script>
// === CONFIGURAÇÃO DO SUPABASE ===
const SUPABASE_URL = 'https://wpnzxcabdgywyktbvdrg.supabase.co';
const SUPABASE_KEY = 'sb_publishable_5wTL2X5LlbKE41QLWSZCFw_UuiiEmSv'; 
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const dt=d=>d?new Date(d+(d.length===10?'T12:00:00':'')).toLocaleDateString('pt-BR'):'';
const hm=d=>d?new Date(d).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'';
const LIM={Essencial:5,Premium:10};

const S={
  user:null, profile:null, mode:'login', view:'inicio', msg:'',
  activeClientId:null,
  clients:[], services:[], notas:[], boletos:[], msgs:[]
};

const isPrestador=()=>S.profile?.role==='prestador';
// Conta só as notas do mês atual (o limite do plano é mensal)
const noMes=n=>{const d=new Date(n.criado_em),h=new Date();return d.getMonth()===h.getMonth()&&d.getFullYear()===h.getFullYear()};
const used=()=>S.notas.filter(noMes).length;
const lim=()=>LIM[S.profile?.plano||'Essencial']||5;

async function loadData(){
  if(!S.user)return;
  const {data:prof}=await sb.from('profiles').select('*').eq('id',S.user.id).single();
  S.profile=prof;
  if(!prof)return;

  if(isPrestador()){
    const [{data:cls},{data:nts},{data:bls},{data:ms}]=await Promise.all([
      sb.from('profiles').select('*').eq('role','cliente').order('nome'),
      sb.from('notas').select('*').order('criado_em',{ascending:true}),
      sb.from('boletos').select('*').order('vencimento',{ascending:true}),
      sb.from('mensagens').select('*').order('criado_em',{ascending:true})
    ]);
    S.clients=cls||[];
    S.notas=nts||[];
    S.boletos=bls||[];
    S.msgs=ms||[];
    if(!S.activeClientId && S.clients.length) S.activeClientId=S.clients[0].id;
  } else {
    S.activeClientId=S.user.id;
    const [{data:srvs},{data:nts},{data:bls},{data:ms}]=await Promise.all([
      sb.from('servicos').select('*').eq('cliente_id',S.user.id).order('id',{ascending:false}),
      sb.from('notas').select('*').eq('cliente_id',S.user.id).order('id',{ascending:true}),
      sb.from('boletos').select('*').eq('cliente_id',S.user.id).order('vencimento',{ascending:true}),
      sb.from('mensagens').select('*').eq('cliente_id',S.user.id).order('criado_em',{ascending:true})
    ]);
    S.services=srvs||[];
    S.notas=nts||[];
    S.boletos=bls||[];
    S.msgs=ms||[];
  }
  render();
}

// Tempo real para novas mensagens
sb.channel('chat-channel')
  .on('postgres_changes',{event:'INSERT',schema:'public',table:'mensagens'},payload=>{
    if(S.user){
      // evita duplicar quando a mensagem já veio no recarregamento
      if(!S.msgs.some(m=>m.id===payload.new.id)) S.msgs.push(payload.new);
      if(S.view==='chat') render();
    }
  }).subscribe();

function login(){
  const reg=S.mode==='register';
  return `<div class="login"><div class="lp"><div class="brand" style="padding:0"><span class="mark"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8l3.5 3.5L13 5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Simplifica MEI</div><h1>Tudo do seu MEI, num só lugar.</h1><p>Notas, boletos, serviços e conversa com a gente, sem depender de planilha.</p></div>
<div class="rp"><div class="card"><h2 style="font-size:22px">${reg?'Criar conta':'Entrar'}</h2>
${reg?`<label>Seu Nome<input id="nm" placeholder="Ex.: Maria Souza"></label><label>Nome da Empresa (MEI)<input id="emp" placeholder="Ex.: Doces da Maria"></label>`:''}
<label>E-mail<input id="em" type="email" placeholder="seu@email.com" autocomplete="email"></label>
<label>Senha<input id="pw" type="password" placeholder="••••••"></label>
${S.msg?`<p class="proto" style="margin:0">${esc(S.msg)}</p>`:''}
<button class="btn" data-a="${reg?'do-reg':'do-login'}">${reg?'Cadastrar':'Entrar'}</button>
<button class="btn ol" data-a="toggle-mode">${reg?'Já tenho uma conta':'Criar nova conta'}</button>
</div></div></div>`;
}

function vInicio(){
  const u=used(),l=lim(),p=S.profile?.plano||'Essencial',n=Math.max(u,l);
  const pips=Array.from({length:n},(_,i)=>`<i class="${i<u?(i>=l?'x':'on'):''}"></i>`).join('');
  const b=S.boletos.find(x=>!x.pago),tot=S.services.reduce((a,s)=>a+Number(s.valor),0),pr=p==='Premium';
  return `<div class="card hero"><h1>${u} de ${l} notas usadas</h1><div class="pips" aria-hidden="true">${pips}</div><p class="mu">${u<l?`Ainda dá para emitir ${l-u}.`:'Limite do plano atingido. Cada nota extra custa R$ 20.'}</p><div style="margin-top:14px"><button class="btn" data-a="go-notas">Emitir nota</button></div></div>
<div class="grid"><div class="card"><h3>Próximo boleto</h3>${b?`<div class="big">${brl(b.valor)}</div><p class="mu">${esc(b.descricao)}<br>vence em ${dt(b.vencimento)}</p><button class="btn ol sm" style="margin-top:10px" data-a="go-boletos">Ver boletos</button>`:'<p class="mu">Nenhum boleto em aberto.</p>'}</div>
<div class="card"><h3>Serviços registrados</h3><div class="big">${brl(tot)}</div><p class="mu">${S.services.length} serviços registrados</p><button class="btn ol sm" style="margin-top:10px" data-a="go-servicos">Registrar serviço</button></div>
<div class="card ${pr?'':'lock'}"><h3>Contratação de funcionário</h3><p class="mu">${pr?'Admissão, registro e folha mensal pela nossa equipe.':'Disponível no plano Premium. Fale com a equipe para mudar de plano.'}</p><button class="btn ol sm" style="margin-top:10px" data-a="go-chat">${pr?'Solicitar admissão':'Pedir upgrade'}</button></div></div>`;
}

function vServ(){
  const rows=S.services.map(s=>`<tr><td>${esc(s.descricao)}</td><td>${dt(s.data)}</td><td>${brl(s.valor)}</td></tr>`).join('');
  return `<div class="card"><div class="row"><label style="flex:2">Descrição do serviço<input id="sd" placeholder="Ex.: Entrega de 20 marmitas"></label><label>Valor (R$)<input id="sv" inputmode="decimal" placeholder="0,00"></label><button class="btn" data-a="add-serv">Registrar serviço</button></div><p class="mu">${esc(S.msg)}</p></div>
<div class="card tw" style="margin-top:16px"><table><thead><tr><th>Serviço</th><th>Data</th><th>Valor</th></tr></thead><tbody>${rows||'<tr><td colspan="3" class="mu">Nenhum serviço registrado ainda.</td></tr>'}</tbody></table></div>`;
}

function vNotas(){
  const u=used(),l=lim(),ex=u>=l;
  const rows=[...S.notas].reverse().map((n,idx)=>`<tr><td>#${S.notas.length-idx}</td><td>${esc(n.tomador)}</td><td>${esc(n.descricao)}</td><td>${brl(n.valor)}</td><td><span class="st ${n.excedente?'a':''}">${n.excedente?'Excedente R$ 20':'Emitida'}</span></td></tr>`).join('');
  return `<div class="card">${ex?`<p class="proto" style="margin-bottom:12px">Você usou as ${l} notas do plano ${esc(S.profile?.plano)}. A próxima será marcada como excedente (R$ 20).</p>`:''}<div class="row"><label>Tomador<input id="nt" placeholder="Nome ou CNPJ do cliente"></label><label style="flex:2">Serviço prestado<input id="nd" placeholder="Descrição na nota"></label><label>Valor (R$)<input id="nv" inputmode="decimal" placeholder="0,00"></label><button class="btn" data-a="add-nota">${ex?'Emitir nota (R$ 20)':'Emitir nota'}</button></div><p class="mu">${esc(S.msg)}</p></div>
<div class="card tw" style="margin-top:16px"><table><thead><tr><th>Nota</th><th>Tomador</th><th>Serviço</th><th>Valor</th><th>Situação</th></tr></thead><tbody>${rows||'<tr><td colspan="5" class="mu">Nenhuma nota solicitada ainda.</td></tr>'}</tbody></table></div>`;
}

function vBol(){
  if(isPrestador()){
    const opts=S.clients.map(c=>`<option value="${c.id}" ${c.id===S.activeClientId?'selected':''}>${esc(c.nome||c.id)} (${esc(c.empresa||'Sem empresa')})</option>`).join('');
    const rows=S.boletos.map(b=>{
      const cli=S.clients.find(c=>c.id===b.cliente_id);
      return `<tr><td><b>${esc(cli?.nome||'Cliente')}</b><br><small class="mu">${esc(b.descricao)}</small></td><td>${dt(b.vencimento)}</td><td>${brl(b.valor)}</td><td><span class="st ${b.pago?'':'a'}">${b.pago?'Pago':'Em aberto'}</span></td><td>${b.pago?'':`<button class="btn sm" data-a="pay" data-i="${b.id}">Marcar pago</button>`} <button class="btn ol sm" data-a="del-bol" data-i="${b.id}">Excluir</button></td></tr>`;
    }).join('');
    return `<div class="card"><div class="row"><label>Cliente<select id="bc">${opts}</select></label><label style="flex:2">Descrição<input id="bd" placeholder="Ex.: DAS MEI — Novembro"></label><label>Valor (R$)<input id="bv" inputmode="decimal" placeholder="86,05"></label><label>Vencimento<input id="bdt" type="date"></label></div><div class="row"><label style="flex:3">Linha digitável (opcional)<input id="bl" placeholder="Código de barras / Pix copia e cola"></label><button class="btn" data-a="add-bol">Lançar boleto</button></div><p class="mu">${esc(S.msg)}</p></div>
<div class="card tw" style="margin-top:16px"><table><thead><tr><th>Cliente / Cobrança</th><th>Vencimento</th><th>Valor</th><th>Situação</th><th>Ações</th></tr></thead><tbody>${rows||'<tr><td colspan="5" class="mu">Nenhum boleto cadastrado.</td></tr>'}</tbody></table></div>`;
  }
  const rows=S.boletos.map(b=>`<tr><td>${esc(b.descricao)}</td><td>${dt(b.vencimento)}</td><td>${brl(b.valor)}</td><td><span class="st ${b.pago?'':'a'}">${b.pago?'Pago':'Em aberto'}</span></td><td>${!b.pago && b.linha?`<button class="btn ol sm" data-a="copy" data-i="${b.id}">Copiar código</button>`:''}</td></tr>`).join('');
  return `<div class="card tw"><table><thead><tr><th>Cobrança</th><th>Vencimento</th><th>Valor</th><th>Situação</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="5" class="mu">Nenhum boleto disponível.</td></tr>'}</tbody></table></div><p class="mu" style="margin-top:10px">${esc(S.msg)}</p>`;
}

function vChat(){
  const p=isPrestador();
  const targetId=p?S.activeClientId:S.user.id;
  const filtered=S.msgs.filter(m=>m.cliente_id===targetId);
  const mySender=p?'prestador':'cliente';
  const cli=S.clients.find(c=>c.id===targetId);
  const list=filtered.map(m=>`<div class="m ${m.de===mySender?'me':''}">${esc(m.texto)}<small>${m.de==='prestador'?'Equipe':esc(cli?.nome||S.profile?.nome||'Cliente')} · ${hm(m.criado_em)}</small></div>`).join('');
  const selCli=p?`<div style="margin-bottom:12px"><label>Conversando com:<select id="chat-cli">${S.clients.map(c=>`<option value="${c.id}" ${c.id===targetId?'selected':''}>${esc(c.nome||'Sem nome')} — ${esc(c.empresa||'')}</option>`).join('')}</select></label></div>`:'';
  return `<div class="card chat">${selCli}<h3>${p?esc(cli?.nome||'Selecione um cliente'):'Equipe Simplifica MEI'}</h3><div class="msgs" id="ms">${list||'<p class="mu">Nenhuma mensagem ainda. Envie um oi!</p>'}</div><div class="row" style="margin:0"><label style="min-width:0"><input id="ci" placeholder="Escreva uma mensagem" autocomplete="off"></label><button class="btn" data-a="send">Enviar</button></div></div>`;
}

function vCli(){
  const rows=S.clients.map(c=>{
    const u=S.notas.filter(n=>n.cliente_id===c.id&&noMes(n)).length, l=LIM[c.plano]||5;
    return `<tr><td><b>${esc(c.nome||'Sem nome')}</b><br><span class="mu">${esc(c.empresa||'')}</span></td><td><select data-plan="${c.id}" aria-label="Plano de ${esc(c.nome)}">${Object.keys(LIM).map(p=>`<option ${p===c.plano?'selected':''}>${p}</option>`).join('')}</select></td><td>${u} de ${l}</td><td><span class="st ${u>=l?'a':''}">${u>=l?'No limite':'Dentro do plano'}</span></td></tr>`;
  }).join('');
  return `<div class="card tw"><table><thead><tr><th>Cliente</th><th>Plano</th><th>Notas no mês</th><th>Situação</th></tr></thead><tbody>${rows||'<tr><td colspan="4" class="mu">Nenhum cliente cadastrado ainda.</td></tr>'}</tbody></table></div><p class="mu" style="margin-top:10px">${esc(S.msg)}</p>`;
}

const TITLES={inicio:'Início',servicos:'Serviços',notas:'Notas fiscais',boletos:'Boletos',chat:'Chat',clientes:'Clientes'};
function render(){
  const a=$('#app');
  if(!S.user || !S.profile){a.innerHTML=login();return}
  const c=!isPrestador(), nav=c?['inicio','servicos','notas','boletos','chat']:['clientes','boletos','chat'];
  if(!nav.includes(S.view)) S.view=nav[0];
  const V={inicio:vInicio,servicos:vServ,notas:vNotas,boletos:vBol,chat:vChat,clientes:vCli}[S.view]();
  a.innerHTML=`<div class="shell"><aside><div class="brand"><span class="mark"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8l3.5 3.5L13 5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Simplifica MEI</div>${nav.map(k=>`<button class="nv" data-a="go-${k}" ${k===S.view?'aria-current="page"':''}>${TITLES[k]}</button>`).join('')}<div class="who"><b>${esc(S.profile.nome||S.user.email)}</b>${c?esc(S.profile.empresa||'Cliente MEI'):'Prestador'}<br><button data-a="out">Sair</button></div></aside>
<main class="main"><div class="top"><h2>${TITLES[S.view]}</h2>${c?`<span class="badge">Plano ${esc(S.profile.plano)} · ${lim()} notas/mês</span>`:'<span class="badge">Visão do prestador</span>'}</div>${V}</main></div>`;
  const m=$('#ms');if(m)m.scrollTop=m.scrollHeight;
}

const num=v=>parseFloat(String(v).replace(/\./g,'').replace(',','.'));

document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a;

  if(a==='toggle-mode'){
    S.mode=S.mode==='login'?'register':'login'; S.msg=''; render();
  }
  else if(a==='do-login'){
    const email=$('#em').value.trim(), password=$('#pw').value;
    S.msg='Entrando...'; render();
    const {data,error}=await sb.auth.signInWithPassword({email,password});
    if(error){S.msg='Erro ao entrar: '+error.message;render();return}
    S.user=data.user; S.msg=''; await loadData();
  }
  else if(a==='do-reg'){
    const nome=$('#nm').value.trim(), empresa=$('#emp').value.trim(), email=$('#em').value.trim(), password=$('#pw').value;
    if(!nome||!email||!password){S.msg='Preencha nome, e-mail e senha.';render();return}
    S.msg='Criando conta...'; render();
    const {data,error}=await sb.auth.signUp({email,password,options:{data:{nome,empresa}}});
    if(error){S.msg='Erro: '+error.message;render();return}
    if(!data.session){S.mode='login';S.msg='Conta criada! Confirme o e-mail que enviamos e depois entre.';render();return}
    S.user=data.user; S.msg=''; await loadData();
  }
  else if(a==='out'){
    await sb.auth.signOut();
    S.user=null; S.profile=null; S.activeClientId=null;
    S.clients=[]; S.services=[]; S.notas=[]; S.boletos=[]; S.msgs=[];
    S.view='inicio'; S.msg='';
    render();
  }
  else if(a.startsWith('go-')){
    S.view=a.slice(3); S.msg=''; render();
  }
  else if(a==='add-serv'){
    const descricao=$('#sd').value.trim(), valor=num($('#sv').value);
    if(!descricao||!(valor>0)){S.msg='Preencha a descrição e um valor maior que zero.';render();return}
    const {error}=await sb.from('servicos').insert({cliente_id:S.user.id,descricao,valor});
    S.msg=error?'Erro: '+error.message:'Serviço registrado com sucesso!';
    await loadData();
  }
  else if(a==='add-nota'){
    const tomador=$('#nt').value.trim(), descricao=$('#nd').value.trim(), valor=num($('#nv').value);
    if(!tomador||!descricao||!(valor>0)){S.msg='Preencha tomador, serviço e um valor maior que zero.';render();return}
    const excedente=used()>=lim();
    const {error}=await sb.from('notas').insert({cliente_id:S.user.id,tomador,descricao,valor,excedente});
    S.msg=error?'Erro: '+error.message:`Nota emitida${excedente?' (excedente)':''}!`;
    await loadData();
  }
  else if(a==='add-bol'){
    const cliente_id=$('#bc').value, descricao=$('#bd').value.trim(), valor=num($('#bv').value), vencimento=$('#bdt').value, linha=$('#bl').value.trim();
    if(!cliente_id||!descricao||!(valor>0)||!vencimento){S.msg='Preencha cliente, descrição, valor e vencimento.';render();return}
    const {error}=await sb.from('boletos').insert({cliente_id,descricao,valor,vencimento,linha});
    S.msg=error?'Erro: '+error.message:'Boleto lançado para o cliente!';
    await loadData();
  }
  else if(a==='pay'){
    await sb.from('boletos').update({pago:true}).eq('id',b.dataset.i);
    S.msg='Pagamento registrado.'; await loadData();
  }
  else if(a==='del-bol'){
    await sb.from('boletos').delete().eq('id',b.dataset.i);
    S.msg='Boleto removido.'; await loadData();
  }
  else if(a==='copy'){
    const l=S.boletos.find(x=>x.id==b.dataset.i)?.linha||'';
    try{navigator.clipboard.writeText(l)}catch(_){}
    S.msg='Código copiado: '+l; render();
  }
  else if(a==='send'){
    const i=$('#ci'), texto=i.value.trim(); if(!texto)return;
    const cliente_id=isPrestador()?S.activeClientId:S.user.id;
    const de=isPrestador()?'prestador':'cliente';
    i.value='';
    await sb.from('mensagens').insert({cliente_id,de,texto});
    await loadData();
    const x=$('#ci');if(x)x.focus();
  }
});

document.addEventListener('change',async e=>{
  const s=e.target.closest('[data-plan]');
  if(s){
    await sb.from('profiles').update({plano:s.value}).eq('id',s.dataset.plan);
    S.msg='Plano do cliente atualizado!';
    await loadData();
  }
  if(e.target.id==='chat-cli'){
    S.activeClientId=e.target.value;
    render();
  }
});

document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='ci') document.querySelector('[data-a="send"]').click();
});

// Verifica se já existe sessão ativa ao abrir a página
sb.auth.getSession().then(({data:{session}})=>{
  if(session?.user){S.user=session.user;loadData()}
  else render();
});
</script>
</body>
</html>
